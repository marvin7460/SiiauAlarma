# Netlify settings for the site (see docs/deploy.md). It is a pnpm monorepo: in the site's
# settings, Base directory is the repository root and Package directory is apps/web.

[build]
  command = "pnpm --filter @haycupo/web build && pnpm --filter @haycupo/web build:functions"
  # Relative to the base directory (the repository root), unlike the functions directory.
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify fails the build when the value of a variable marked secret appears in the code.
  # These are settings, not secrets (3000, 2500, "resend"...), and their values do appear in
  # the code as defaults. The real secrets (tokens, keys, APP_SECRET, INTERNAL_API_TOKEN) are
  # still scanned. This value overrides the one in the site's settings.
  SECRETS_SCAN_OMIT_KEYS = "SECRETS_SCAN_OMIT_KEYS,APP_URL,EMAIL_DAILY_LIMIT,EMAIL_FROM,EMAIL_TRANSPORT,NOTIFY_COOLDOWN_MINUTES,POLL_INTERVAL_SECONDS,POLL_MAX_SUBJECTS_PER_RUN,POLL_REGISTRATION_INTERVAL_SECONDS,POLL_UNPUBLISHED_INTERVAL_SECONDS,SCHEDULER_ENABLED,SEARCH_CACHE_TTL_SECONDS,SIIAU_CONTACT_EMAIL,SIIAU_ENABLED,SIIAU_MAX_WAIT_MS,SIIAU_MIN_DELAY_MS,SIIAU_TIMEOUT_MS,TELEGRAM_BOT_USERNAME,VAPID_PUBLIC_KEY"

# Functions come from apps/web/netlify/functions (the default), which build:functions generates
# from apps/web/netlify-functions/ as plain JavaScript (see scripts/build-functions.ts).
[functions]
  node_bundler = "esbuild"
  # libSQL loads a native binary for the platform; ship it as a module, not inlined.
  external_node_modules = ["@libsql/client", "libsql"]

# Every minute. Each run checks at most one subject (POLL_MAX_SUBJECTS_PER_RUN=1); a slower
# schedule costs fewer credits but checks fewer subjects (see docs/deploy.md).
[functions.poll]
  schedule = "* * * * *"
