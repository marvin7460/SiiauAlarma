name: CodeQL

# GitHub's static analysis for security bugs (injections, XSS, open redirects, leaked secrets…).
# Free for public repositories. Results: Security → Code scanning. Keep GitHub's "default setup"
# off: it and this workflow cannot run together.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
