name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the site
        run: pnpm --filter @haycupo/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @haycupo/web exec playwright install --with-deps chromium
      # One Next.js server on a SQLite file, with the fake SIIAU and the fake Telegram API.
      - name: End-to-end tests
        run: pnpm --filter @haycupo/web test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The production image builds (the deploy builds the same Dockerfile on the server).
  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build --tag haycupo:ci .

  # The site as Netlify builds it, and the scheduled function as Netlify packages it.
  netlify:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Netlify build (offline, no account needed)
        run: pnpm netlify build --offline --filter @haycupo/web
        env:
          NETLIFY_TELEMETRY_DISABLED: "1"
      - name: Load the packaged scheduled function
        run: pnpm --filter @haycupo/web check:netlify
