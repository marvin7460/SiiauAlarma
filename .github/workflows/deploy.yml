name: Deploy

# Deploys the site to Netlify: by hand (Actions → Deploy → Run workflow) or when a version tag
# is pushed (git tag v1.2.0 && git push --tags). Not on every push: on Netlify's free plan each
# production deploy costs 15 of the month's 300 credits (see docs/deploy.md).
# Nothing runs until the repository variable DEPLOY_ENABLED is "true".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A tag can point at any commit: check it before it reaches students.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations only add things, so the site that is live keeps working until the new
      # deploy replaces it.
      - name: Apply database migrations (Turso)
        run: pnpm --filter @haycupo/db migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Build and deploy to Netlify
        run: pnpm netlify deploy --prod --filter @haycupo/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TELEMETRY_DISABLED: "1"
      - name: Check /api/health
        if: vars.SITE_URL != ''
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${{ vars.SITE_URL }}/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1
